[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-openrouter-mcp"
version = "0.4.2"
description = "Secure local MCP delegation from Codex to approved OpenRouter models"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "bladehstream" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
codex-openrouter-mcp = "codex_openrouter_delegator.server:serve"
codex-openrouter-routes = "codex_openrouter_delegator.route_config:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_openrouter_delegator = ["default_routes.json"]
